<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talentcore | Səhifə Tapılmadı</title>
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="Axtardığınız səhifə tapılmadı.">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/notfound.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <script>
        // Tema DOM render olunmazdan əvvəl tətbiq olunur ki, səhifə açılanda
        // yanlış tema anlıq görünüb sonra dəyişməsin (FOUC problemi).
        (function () {
            var savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
            }
        })();
    </script>

    <header class="glass-header">
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.png" alt="Talentcore Logo" class="site-logo">
            </a>
        </div>

        <button class="hamburger" id="hamburger-btn" aria-label="Menyu" aria-expanded="false" aria-controls="nav-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="nav-menu">
            <ul>
                <li><a href="index.html" class="lang" data-en="Home" data-az="Ana Səhifə">Ana Səhifə</a></li>
                <li><a href="about.html" class="lang" data-en="About Us" data-az="Haqqımızda">Haqqımızda</a></li>
                <li><a href="services.html" class="lang" data-en="Services" data-az="Xidmətlər">Xidmətlər</a></li>
                <li><a href="vacancies.html" class="lang" data-en="Vacancies" data-az="Vakansiyalar">Vakansiyalar</a></li>
                <li><a href="industries.html" class="lang" data-en="Areas of Expertise" data-az="İxtisaslaşdığımız sahələr">İxtisaslaşdığımız sahələr</a></li>
                <li><a href="contact.html" class="lang" data-en="Contact" data-az="Əlaqə">Əlaqə</a></li>
            </ul>
        </nav>

        <div class="header-right" id="header-right">
            <label class="theme-switch" for="theme-toggle">
                <input type="checkbox" id="theme-toggle" aria-label="Tünd / Açıq rejim">
                <span class="slider round">
                    <span class="icon sun">☀️</span>
                    <span class="icon moon">🌙</span>
                </span>
            </label>

            <select id="lang-switch" class="lang-dropdown" aria-label="Dil seçimi">
                <option value="az" selected>AZ</option>
                <option value="en">EN</option>
            </select>
            <a href="cv.html" class="send-cv-btn lang" data-en="Send Your CV" data-az="CV Göndər">CV Göndər</a>
        </div>
    </header>

    <main>
        <section class="notfound-page">
            <div class="notfound-content">
                <div class="notfound-code">404</div>
                <h1 class="lang" data-en="Page Not Found" data-az="Səhifə Tapılmadı">Səhifə Tapılmadı</h1>
                <p class="lang"
                   data-en="The page you are looking for doesn't exist or has been moved. Let's get you back on track."
                   data-az="Axtardığınız səhifə mövcud deyil və ya başqa ünvana köçürülüb. Sizi ana səhifəyə qaytaraq.">
                   Axtardığınız səhifə mövcud deyil və ya başqa ünvana köçürülüb. Sizi ana səhifəyə qaytaraq.
                </p>
                <a href="index.html" class="btn-primary lang" data-en="Back to Home" data-az="Ana Səhifəyə Qayıt">Ana Səhifəyə Qayıt</a>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
