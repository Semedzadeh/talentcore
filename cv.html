<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talentcore - CV Göndər</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <span class="global">Talent</span><span class="talent">core</span>
                <div class="subtitle">RECRUITMENT</div>
            </a>
        </div>
        
        <nav>
            <ul>
                <li><a href="index.html" class="lang" data-en="Home" data-az="Ana Səhifə">Ana Səhifə</a></li>
                <li><a href="about.html" class="lang" data-en="About Us" data-az="Haqqımızda">Haqqımızda</a></li>
                <li><a href="services.html" class="lang" data-en="Services" data-az="Xidmətlər">Xidmətlər</a></li>
                <li><a href="vacancies.html" class="lang" data-en="Vacancies" data-az="Vakansiyalar">Vakansiyalar</a></li>
                <li><a href="industries.html" class="lang" data-en="Partners" data-az="Tərəfdaşlar">Tərəfdaşlar</a></li>
                <li><a href="contact.html" class="lang" data-en="Contact" data-az="Əlaqə">Əlaqə</a></li>
            </ul>
        </nav>

        <div class="header-right">
            <select id="lang-switch" onchange="changeLanguage()">
                <option value="az" selected>AZ</option>
                <option value="en">EN</option>
            </select>
            <a href="cv.html" class="send-cv lang" data-en="Send Your CV" data-az="CV Göndər">CV Göndər</a>
        </div>
    </header>

    <section class="cv-section">
        <div class="cv-container">
            <div class="cv-header">
                <h2 class="lang" data-en="Submit Your CV" data-az="CV-nizi Göndərin">CV-nizi Göndərin</h2>
                <p class="lang" data-en="Take the next step in your career. Upload your CV and let our experts match you with the best opportunities." data-az="Karyeranızda növbəti addımı atın. CV-nizi yükləyin və mütəxəssislərimiz sizi ən uyğun vakansiyalarla əlaqələndirsin.">Karyeranızda növbəti addımı atın. CV-nizi yükləyin və mütəxəssislərimiz sizi ən uyğun vakansiyalarla əlaqələndirsin.</p>
            </div>
            
            <div class="cv-form-box">
                <form>
                    <div class="input-group">
                        <input type="text" class="lang-placeholder" data-en="Full Name" data-az="Ad və Soyad" placeholder="Ad və Soyad" required>
                        <input type="email" class="lang-placeholder" data-en="Email Address" data-az="E-poçt ünvanı" placeholder="E-poçt ünvanı" required>
                    </div>
                    <div class="input-group">
                        <input type="tel" class="lang-placeholder" data-en="Phone Number" data-az="Telefon nömrəsi" placeholder="Telefon nömrəsi" required>
                        <input type="url" class="lang-placeholder" data-en="LinkedIn Profile (Optional)" data-az="LinkedIn Profili (İstəyə bağlı)" placeholder="LinkedIn Profili (İstəyə bağlı)">
                    </div>
                    
                    <!-- Xüsusi CV Yükləmə Qutusu -->
                    <div class="file-upload">
                        <label for="cv-file" class="file-label">
                            <span class="icon">📄</span>
                            <span class="lang" data-en="Click to upload your CV (PDF, DOCX)" data-az="CV yükləmək üçün klikləyin (PDF, DOCX)">CV yükləmək üçün klikləyin (PDF, DOCX)</span>
                        </label>
                        <input type="file" id="cv-file" accept=".pdf,.doc,.docx" hidden>
                    </div>
                    
                    <button type="button" class="submit-btn lang" data-en="Submit Application" data-az="Müraciəti Göndər">Müraciəti Göndər</button>
                </form>
            </div>
        </div>
    </section>

    <script>
        function changeLanguage() {
            const selectedLang = document.getElementById('lang-switch').value;
            
            document.querySelectorAll('.lang').forEach(el => {
                if(selectedLang === 'az') el.innerHTML = el.getAttribute('data-az');
                else el.innerHTML = el.getAttribute('data-en');
            });
            
            document.querySelectorAll('.lang-placeholder').forEach(el => {
                if(selectedLang === 'az') el.setAttribute('placeholder', el.getAttribute('data-az'));
                else el.setAttribute('placeholder', el.getAttribute('data-en'));
            });
        }
    </script>
</body>
</html>
