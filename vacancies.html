<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talentcore | Vakansiyalar</title>
    <meta name="description" content="Talentcore vasitəsilə açıq vakansiyalar — sahələr üzrə axtarış edin, sizə uyğun mövqeyi tapın və birbaşa müraciət edin.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Talentcore | Vakansiyalar">
    <meta property="og:description" content="Sahələr üzrə açıq vakansiyalar — sizə uyğun mövqeyi tapın və müraciət edin.">
    <meta property="og:image" content="https://talentcore.az/logo.png">
    <meta property="og:url" content="https://talentcore.az/vacancies.html">
    <link rel="canonical" href="https://talentcore.az/vacancies.html">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/vacancies.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <script>
        // Tema DOM render olunmazdan əvvəl tətbiq olunur ki, səhifə açılanda
        // yanlış tema anlıq görünüb sonra dəyişməsin (FOUC problemi).
        (function () {
            var savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
            }
        })();
    </script>

    <header class="glass-header">
        <div class="logo-container">
            <a href="index.html">
                <img src="logo.png" alt="Talentcore Logo" class="site-logo">
            </a>
        </div>

        <button class="hamburger" id="hamburger-btn" aria-label="Menyu" aria-expanded="false" aria-controls="nav-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="nav-menu">
            <ul>
                <li><a href="index.html" class="lang" data-en="Home" data-az="Ana Səhifə">Ana Səhifə</a></li>
                <li><a href="about.html" class="lang" data-en="About Us" data-az="Haqqımızda">Haqqımızda</a></li>
                <li><a href="services.html" class="lang" data-en="Services" data-az="Xidmətlər">Xidmətlər</a></li>
                <li><a href="vacancies.html" class="lang" data-en="Vacancies" data-az="Vakansiyalar">Vakansiyalar</a></li>
                <li><a href="industries.html" class="lang" data-en="Areas of Expertise" data-az="İxtisaslaşdığımız sahələr">İxtisaslaşdığımız sahələr</a></li>
                <li><a href="contact.html" class="lang" data-en="Contact" data-az="Əlaqə">Əlaqə</a></li>
            </ul>
        </nav>

        <div class="header-right" id="header-right">
            <label class="theme-switch" for="theme-toggle">
                <input type="checkbox" id="theme-toggle" aria-label="Tünd / Açıq rejim">
                <span class="slider round">
                    <span class="icon sun">☀️</span>
                    <span class="icon moon">🌙</span>
                </span>
            </label>

            <select id="lang-switch" class="lang-dropdown" aria-label="Dil seçimi">
                <option value="az" selected>AZ</option>
                <option value="en">EN</option>
            </select>
            <a href="cv.html" class="send-cv-btn lang" data-en="Send Your CV" data-az="CV Göndər">CV Göndər</a>
        </div>
    </header>

    <main>
        <section class="vacancies-page">
            <div class="vacancies-hero">
                <h1 class="lang" data-en="Open Vacancies" data-az="Vakansiyalar">Vakansiyalar</h1>
                <p class="lang" data-en="Search by field and find the right role for you." data-az="Sahələr üzrə axtarış edin, sizə uyğun mövqeyi tapın.">Sahələr üzrə axtarış edin, sizə uyğun mövqeyi tapın.</p>
            </div>

            <div class="vacancies-layout">
                <aside class="vacancies-sidebar">
                    <h3 class="lang" data-en="Fields" data-az="Sahələr">Sahələr</h3>
                    <ul class="cat-list" id="category-list">
                        <!-- JS ilə doldurulur: js/vacancies.js -->
                    </ul>
                </aside>

                <div class="vacancies-list" id="vacancies-list">
                    <!-- JS ilə doldurulur: js/vacancies.js -->
                </div>

                <div class="vacancy-detail" id="vacancy-detail">
                    <!-- JS ilə doldurulur: js/vacancies.js -->
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/vacancies.js"></script>
</body>
</html>
